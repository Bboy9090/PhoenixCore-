services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoenix-os-builder:pr22
    platform: ${PHOENIX_OS_PLATFORM:-linux/amd64}
    privileged: true
    working_dir: /workspace/os/phoenix-os
    environment:
      BUILD_ENV: oci
      PHOENIX_OS_ARTIFACT_DIR: /workspace/os/phoenix-os/build
      PHOENIX_APT_PROXY: ${PHOENIX_APT_PROXY:-}
      PHOENIX_EDITION_STAGING_DIR: ${PHOENIX_EDITION_STAGING_DIR:-/workspace/os/phoenix-os/cache/edition-staging/live-build-config}
    volumes:
      - type: bind
        source: ../../..
        target: /workspace
        read_only: true
      - type: bind
        source: ../build
        target: /workspace/os/phoenix-os/build
        read_only: false
      - type: bind
        source: ../cache
        target: /workspace/os/phoenix-os/cache
        read_only: false
