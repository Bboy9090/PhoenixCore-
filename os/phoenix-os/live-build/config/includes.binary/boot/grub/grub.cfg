source /boot/grub/config.cfg

# Graphics Terminal & Theme Setup
insmod part_gpt
insmod part_msdos
insmod fat
insmod normal
insmod video
insmod video_fb
insmod gfxterm
insmod gfxmenu

# Load the custom premium graphical theme
set theme=/boot/grub/themes/phoenix/theme.txt

set gfxmode=auto
terminal_output gfxterm

# Detect kernel and architecture dynamically
if [ -f /live/vmlinuz-6.1.0-49-amd64 ]; then
    set kver="6.1.0-49"
    set suffix="-amd64"
    set arch="amd64"
elif [ -f /live/vmlinuz-6.1.0-49-arm64 ]; then
    set kver="6.1.0-49"
    set suffix="-arm64"
    set arch="arm64"
elif [ -f /live/vmlinuz-5.10.0-44-arm64 ]; then
    set kver="5.10.0-44"
    set suffix="-arm64"
    set arch="arm64"
elif [ -f /live/vmlinuz-5.10.0-43-arm64 ]; then
    set kver="5.10.0-43"
    set suffix="-arm64"
    set arch="arm64"
elif [ -f /live/vmlinuz-5.10.0-44-amd64 ]; then
    set kver="5.10.0-44"
    set suffix="-amd64"
    set arch="amd64"
else
    set kver="6.1.0-49"
    set suffix="-amd64"
    set arch="amd64"
fi

set default="Live system X11 app launch probe (${arch})"
set timeout=2
set timeout_style=menu

# PR39F session probe entries. Wayland remains canonical; X11 is an explicit
# fallback probe selected only by the VM harness or an operator.
menuentry "Live system Wayland profile (${arch})" --hotkey=w {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=phoenix bwos.session=wayland plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Live system X11 fallback profile (${arch})" --hotkey=x {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=phoenix bwos.session=x11 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Live system X11 app launch probe (${arch})" --hotkey=p {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=phoenix bwos.session=x11 bwos.app_probe=1 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Live system X11 app launch probe (${arch})" --hotkey=a {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=phoenix bwos.session=x11 bwos.app_probe=1 bwos.shutdown_probe=1 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

# Temporary PR39B debug entry:
# same live payload, but with verbose kernel/initramfs visibility over serial.
menuentry "Debug live system (${arch})" --hotkey=d {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components username=phoenix bwos.session=wayland console=ttyS0,115200n8 console=tty0 loglevel=7 debug systemd.log_level=debug rd.debug locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

# Live boot
menuentry "Live system (${arch})" --hotkey=l {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=phoenix bwos.session=wayland plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}
menuentry "Live system (${arch} fail-safe mode)" {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=788
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Recovery Text Mode (${arch})" --hotkey=r {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components username=phoenix systemd.unit=multi-user.target plymouth.enable=0 nomodeset console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Arcwyre Flex Live (${arch})" --hotkey=f {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components quiet splash username=arc bwos.session=x11 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

menuentry "Arcwyre Flex Recovery Text Mode (${arch})" {
	linux	/live/vmlinuz-${kver}${suffix} boot=live components username=arc systemd.unit=multi-user.target plymouth.enable=0 nomodeset console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-${kver}${suffix}
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux /live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path} custom options here
# initrd /live/initrd.img-5.10.0-43-amd64
# }
# menuentry "Alternate graphical installer" {
# linux   custom options here
# initrd
# }
# menuentry "Alternate textual installer" {
# linux   custom options here
# initrd
# }

# Installer (if any)
if false; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if false; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi

}
