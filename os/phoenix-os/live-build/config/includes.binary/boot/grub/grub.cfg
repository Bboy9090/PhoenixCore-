source /boot/grub/config.cfg

set default="Live system X11 app launch probe (amd64)"
set timeout=2
set timeout_style=menu

# PR39F session probe entries. Wayland remains canonical; X11 is an explicit
# fallback probe selected only by the VM harness or an operator.
menuentry "Live system Wayland profile (amd64)" --hotkey=w {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix bwos.session=wayland plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}

menuentry "Live system X11 fallback profile (amd64)" --hotkey=x {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix bwos.session=x11 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}

menuentry "Live system X11 app launch probe (amd64)" --hotkey=p {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix bwos.session=x11 bwos.app_probe=1 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}

menuentry "Live system X11 app launch probe (amd64)" --hotkey=a {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix bwos.session=x11 bwos.app_probe=1 bwos.shutdown_probe=1 plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}

# Temporary PR39B debug entry:
# same live payload, but with verbose kernel/initramfs visibility over serial.
menuentry "Debug live system (amd64)" --hotkey=d {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components username=phoenix bwos.session=wayland console=ttyS0,115200n8 console=tty0 loglevel=7 debug systemd.log_level=debug rd.debug locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}

# Live boot
menuentry "Live system (amd64)" --hotkey=l {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix bwos.session=wayland plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path}
	initrd	/live/initrd.img-5.10.0-43-amd64
}
menuentry "Live system (amd64 fail-safe mode)" {
	linux	/live/vmlinuz-5.10.0-43-amd64 boot=live components memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=788
	initrd	/live/initrd.img-5.10.0-43-amd64
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux /live/vmlinuz-5.10.0-43-amd64 boot=live components quiet splash username=phoenix plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 locales=en_US.UTF-8 keyboard-layouts=us findiso=${iso_path} custom options here
# initrd /live/initrd.img-5.10.0-43-amd64
# }
# menuentry "Alternate graphical installer" {
# linux   custom options here
# initrd
# }
# menuentry "Alternate textual installer" {
# linux   custom options here
# initrd
# }

# Installer (if any)
if false; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if false; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi

}
