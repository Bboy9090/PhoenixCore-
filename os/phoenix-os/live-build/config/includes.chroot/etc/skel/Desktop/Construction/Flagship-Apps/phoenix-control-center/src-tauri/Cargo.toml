[package]
name = "phoenix-control-center"
version = "2.0.0"
description = "Professional system management and recovery tools for Phoenix OS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
phoenix-core = { path = "../../../crates/core" }
tokio = { version = "1", features = ["full"] }

[features]
# default enables all tauri features
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]