[package]
name = "phoenix-imaging"
version = "0.1.0"
edition = "2021"

[dependencies]
phoenix-core = { path = "../core" }
sha2 = "0.10"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
