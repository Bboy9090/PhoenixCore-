# Phoenix OS — Calamares: bootloader module
# File: installer/calamares-config/modules/bootloader.conf
#
# Configures GRUB installation on the target system.
# Supports both UEFI and BIOS targets.

---
# GRUB is installed for both BIOS and UEFI targets
efiBootLoaderId: "phoenix"

# Use the signed GRUB for UEFI Secure Boot chains (Phase 2)
# installEFIFallback: false

# GRUB timeout in seconds
timeout: 5

# The GRUB entry label shown in the boot menu
bootLoaderEntryName: "Phoenix OS"

# Write GRUB to MBR for BIOS targets
installMBR: true
