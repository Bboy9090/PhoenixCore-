# Phoenix OS — Calamares: localecfg module
# File: installer/calamares-config/modules/localecfg.conf
#
# Writes locale configuration to the installed system's /etc/locale.gen
# and runs locale-gen inside the chroot.

---
# Generate locales in the installed system
# Always generate en_US.UTF-8; additional locales based on user selection
locales:
  - "en_US.UTF-8 UTF-8"
