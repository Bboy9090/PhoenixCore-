# Phoenix OS — Calamares: initcpiocfg module
# File: installer/calamares-config/modules/initcpiocfg.conf
#
# NOTE: Ubuntu uses update-initramfs, not mkinitcpio.
# This module is a no-op on Ubuntu targets; initramfs generation
# is handled by the phoenix-postinstall.py module.
# Included here so Calamares does not error on the module reference.

---
# No mkinitcpio configuration needed for Ubuntu-based targets.
# update-initramfs is called in phoenix-postinstall.py.
kernel: ""
