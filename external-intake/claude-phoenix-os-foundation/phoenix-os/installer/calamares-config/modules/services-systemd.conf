# Phoenix OS — Calamares: services-systemd module
# File: installer/calamares-config/modules/services-systemd.conf
#
# Enables and disables systemd services on the installed system.
# The live session has different service state than the installed system.

---
services:
  # ---- Enable on installed system ----
  - name: "NetworkManager"
    mandatory: true

  - name: "sddm"
    mandatory: true

  - name: "bluetooth"
    mandatory: false

  - name: "fwupd"
    mandatory: false

  - name: "smartd"
    mandatory: false

  - name: "ufw"
    mandatory: true

  # ---- Disable on installed system (live-session-only services) ----
  - name: "casper"
    enabled: false
    mandatory: false

  - name: "live-tools"
    enabled: false
    mandatory: false
