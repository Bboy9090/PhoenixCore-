# Phoenix OS — Calamares Users Module Configuration
# File: installer/calamares-config/modules/users.conf

---
# Default username suggestion (blank = user must type one)
defaultGroups:
  - name: lpadmin
    must_exist: false
    system: false
  - name: plugdev
    must_exist: false
    system: false
  - name: netdev
    must_exist: false
    system: false

# Groups added to the new user automatically
userShell: /bin/bash

# Require a strong password
passwordRequirements:
  minLength: 8
  maxLength: -1         # No maximum
  libpwquality:
    - minlen=8
    - dcredit=-1        # At least 1 digit
    - lcredit=-1        # At least 1 lowercase

# Allow login without password (not recommended; disabled here)
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# sudoers configuration for the new user
setRootPassword: false
doAutoLogin: false
doReusePassword: false

# Display name default suggestion
fullName: ""
loginName: ""
