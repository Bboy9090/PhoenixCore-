# Phoenix OS — Calamares Welcome Module Configuration
# File: installer/calamares-config/modules/welcome.conf

---
# Requirements check: conditions that must be true before install proceeds
requirements:
  # Minimum RAM required (in MiB)
  requiredRam: 2048
  
  # Minimum free disk space to check for (in GiB)
  requiredStorage: 20
  
  # Check for internet connectivity
  internetCheckUrl: "https://flathub.org"
  
  # Whether internet is required (false = warn but allow offline install)
  required:
    - storage
    - ram
  
  optional:
    - internet
    - power

# Welcome page content
welcomeStyleCalamares: false
welcomeExpandingLogo: true

# Check for internet and show a warning if not available
checkInternet: true
