# Phoenix OS — Calamares: networkcfg module
# File: installer/calamares-config/modules/networkcfg.conf
#
# Copies NetworkManager connections from the live session to the installed system,
# so Wi-Fi credentials configured during live session persist post-install.

---
# Copy NetworkManager system connections from live to installed system
backend: "NetworkManager"

# Copy /etc/NetworkManager/system-connections/* to the installed target
copyConnections: true
