# Calamares Unpackfs Configuration for Phoenix OS
# 
# This module unpacks the live filesystem into the target installation

---
unpack:
    - source: "/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""

    - source: "/live/vmlinuz"
      sourcefs: "file"
      destination: "/boot/vmlinuz"

    - source: "/live/initrd.img"
      sourcefs: "file"
      destination: "/boot/initrd.img"
