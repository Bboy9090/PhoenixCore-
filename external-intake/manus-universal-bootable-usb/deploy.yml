name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ env.VERSION }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Phoenix Ecosystem v${{ env.VERSION }}
          body: |
            ## Release v${{ env.VERSION }}
            
            See CHANGELOG.md for detailed changes.
          draft: false
          prerelease: false

  build-mobile:
    name: Build Mobile App
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build mobile app
        run: pnpm build:mobile
      
      - name: Upload mobile build
        uses: actions/upload-artifact@v3
        with:
          name: mobile-build-${{ needs.create-release.outputs.version }}
          path: apps/mobile/dist/

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: phoenix-control-center-linux.AppImage
          - os: macos-latest
            target: universal-apple-darwin
            artifact: phoenix-control-center-macos.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: phoenix-control-center-windows.exe
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build desktop app
        run: pnpm build:desktop
        working-directory: apps/desktop
      
      - name: Upload desktop build
        uses: actions/upload-artifact@v3
        with:
          name: desktop-build-${{ matrix.os }}-${{ needs.create-release.outputs.version }}
          path: apps/desktop/dist/

  build-os:
    name: Build Phoenix OS
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso
      
      - name: Build OS ISO
        run: |
          cd apps/os
          ./scripts/verify-host.sh
          ./scripts/build-iso.sh
      
      - name: Upload OS build
        uses: actions/upload-artifact@v3
        with:
          name: os-build-${{ needs.create-release.outputs.version }}
          path: apps/os/dist/

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-mobile, build-desktop, build-os]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate checksums
        run: |
          find . -type f -name "*.apk" -o -name "*.ipa" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.iso" | xargs sha256sum > SHA256SUMS
      
      - name: Upload checksums to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
      
      - name: Upload release notes
        run: |
          echo "Release artifacts uploaded successfully"
          echo "Version: ${{ needs.create-release.outputs.version }}"
