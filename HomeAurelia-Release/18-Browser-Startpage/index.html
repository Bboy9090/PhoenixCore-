<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Aurelia Startpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="startpage-container">
        <!-- Brand Crest Logo -->
        <img class="brand-logo" src="logo.png" alt="Home Aurelia Crest">
        
        <!-- Tagline Header -->
        <h1 class="brand-tagline">FOUR LEGACIES. ONE THRONE.</h1>
        
        <!-- Search Field -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search the storm..." autofocus>
        </div>
        
        <!-- Quick Links Panel -->
        <div class="quick-links">
            <a href="https://github.com" class="link-card">GitHub</a>
            <a href="https://kde.org" class="link-card">KDE Community</a>
            <a href="https://reddit.com" class="link-card">Reddit</a>
            <a href="https://news.ycombinator.com" class="link-card">Hacker News</a>
        </div>
    </div>
</body>
</html>
