name: Probe Google Play Vault

on:
  push:
    branches:
      - agent/phoenix-key-artifact-receipts-v1
    paths:
      - ".github/workflows/probe-google-play-vault.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google Play service account vault
        env:
          PLAY_JSON: ${{ secrets.PHOENIXCORE_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_AVAILABLE=false" | tee vault-state.txt
            exit 2
          fi
          printf '%s' "$PLAY_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type")=="service_account"; print("GOOGLE_PLAY_SERVICE_ACCOUNT_AVAILABLE=true")' | tee vault-state.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phoenixcore-google-play-vault-probe
          path: vault-state.txt
          if-no-files-found: ignore
          retention-days: 7
