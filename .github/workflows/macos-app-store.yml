name: Phoenix Key Mac App Store

on:
  push:
    branches:
      - "store-release/phoenix-key-v3.2.0"
  pull_request:
    branches: [main]
    paths:
      - "apps/phoenix-key/**"
      - ".github/workflows/macos-app-store.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Mac App Store marketing version
        required: true
        default: "3.2.0"
      build_number:
        description: Mac App Store build number
        required: true
        default: "32000"

permissions:
  contents: read

concurrency:
  group: phoenix-key-mac-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-safe-preflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Test store-safe Rust profile
        run: cargo test --manifest-path src-tauri/Cargo.toml --features store-safe
      - name: Compile store-safe app bundle
        run: |
          npx tauri icon src-tauri/icons/128x128@2x.png
          npx tauri build --features store-safe --bundles app

  package-and-upload:
    if: github.event_name == 'workflow_dispatch'
    needs: store-safe-preflight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Require Mac App Store credentials
        shell: bash
        env:
          CERTS_B64: ${{ secrets.PHOENIX_KEY_APP_STORE_CERTS_P12_B64 }}
          CERTS_PASSWORD: ${{ secrets.PHOENIX_KEY_APP_STORE_CERTS_P12_PASSWORD }}
          APP_IDENTITY: ${{ secrets.PHOENIX_KEY_APP_STORE_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.PHOENIX_KEY_APP_STORE_INSTALLER_IDENTITY }}
          PROFILE_B64: ${{ secrets.PHOENIX_KEY_APP_STORE_PROVISIONPROFILE_B64 }}
          APPLE_ID: ${{ secrets.PHOENIX_KEY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.PHOENIX_KEY_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTS_B64 CERTS_PASSWORD APP_IDENTITY INSTALLER_IDENTITY PROFILE_B64 APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Mac App Store secret: $name"
              exit 1
            fi
          done

      - run: npm ci

      - name: Import Mac App Store certificates
        shell: bash
        env:
          CERTS_B64: ${{ secrets.PHOENIX_KEY_APP_STORE_CERTS_P12_B64 }}
          CERTS_PASSWORD: ${{ secrets.PHOENIX_KEY_APP_STORE_CERTS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/phoenix-key-app-store.p12"
          KEYCHAIN="$RUNNER_TEMP/phoenix-key-app-store.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTS_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build store-safe app
        env:
          PHOENIX_KEY_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          npx tauri icon src-tauri/icons/128x128@2x.png
          npx tauri build --features store-safe --bundles app

      - name: Embed App Store provisioning profile and entitlements
        shell: bash
        env:
          PROFILE_B64: ${{ secrets.PHOENIX_KEY_APP_STORE_PROVISIONPROFILE_B64 }}
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
          cat > "$RUNNER_TEMP/phoenix-key-app-store-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
            <key>com.apple.security.files.user-selected.read-only</key>
            <true/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version || '3.2.0' }}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number || '32000' }}" "$APP/Contents/Info.plist"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Sign and verify store-safe app
        shell: bash
        env:
          APP_IDENTITY: ${{ secrets.PHOENIX_KEY_APP_STORE_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime             --entitlements "$RUNNER_TEMP/phoenix-key-app-store-entitlements.plist"             --sign "$APP_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2> "$RUNNER_TEMP/effective-entitlements.plist"
          grep -q "com.apple.security.app-sandbox" "$RUNNER_TEMP/effective-entitlements.plist"

      - name: Build and verify signed installer package
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ secrets.PHOENIX_KEY_APP_STORE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/Phoenix-Key-${{ inputs.version || '3.2.0' }}-${{ inputs.build_number || '32000' }}.pkg"
          productbuild             --component "$APP_PATH" /Applications             --sign "$INSTALLER_IDENTITY"             "$PKG"
          pkgutil --check-signature "$PKG"
          shasum -a 256 "$PKG" > "$RUNNER_TEMP/MAC_APP_STORE_SHA256.txt"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Upload Mac App Store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-key-mac-app-store-pkg
          path: |
            ${{ runner.temp }}/Phoenix-Key-*.pkg
            ${{ runner.temp }}/MAC_APP_STORE_SHA256.txt
            ${{ runner.temp }}/effective-entitlements.plist
          if-no-files-found: error
          retention-days: 30

      - name: Upload package to App Store Connect
        shell: bash
        env:
          APPLE_ID: ${{ secrets.PHOENIX_KEY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.PHOENIX_KEY_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun iTMSTransporter             -m upload             -assetFile "$PKG_PATH"             -u "$APPLE_ID"             -p "$APPLE_PASSWORD"
