name: Validate Artifacts

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-manifests:
    name: Validate Artifact Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Manifest JSON Files
        run: |
          python .github/workflows/scripts/validate_artifacts.py

      - name: Verify release provenance receipt contract
        run: node scripts/release/emit-release-provenance.test.mjs

      - name: Verify Downloader integrity and config parameters
        run: |
          # Verify that usb_creator.py does not contain syntax errors
          python -m py_compile usb_creator.py
