name: Validate Artifacts

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-manifests:
    name: Validate Artifact Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Manifest JSON Files
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('**/*.json', recursive=True)
          for f in files:
              if 'node_modules' in f or 'package' in f or 'eslint' in f: continue
              try:
                  with open(f, 'r') as fh:
                      json.load(fh)
                  print(f'[+] Validated JSON structure: {f}')
              except Exception as e:
                  print(f'[-] Invalid JSON file: {f}. Error: {e}')
                  sys.exit(1)
          "

      - name: Verify Downloader integrity and config parameters
        run: |
          # Verify that usb_creator.py does not contain syntax errors
          python -m py_compile usb_creator.py
