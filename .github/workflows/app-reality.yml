name: App Reality Matrix

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  app-matrix-checks:
    name: Validate PR40 App Launch Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Launch Schema Conformance
        run: |
          python .github/workflows/scripts/app_reality.py
