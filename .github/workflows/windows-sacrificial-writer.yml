name: Windows Sacrificial Writer

on:
  pull_request:
  push:
    branches:
      - main
      - agent/windows-sacrificial-writer-v1

permissions:
  contents: read

concurrency:
  group: windows-sacrificial-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: File-backed writer validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatter
        run: python -m pip install black

      - name: Check focused formatting
        run: >-
          black --check --diff
          scripts/hardware/write_windows_sacrificial_drive.py
          tests/test_windows_sacrificial_writer.py

      - name: Compile writer and tests
        run: >-
          python -m compileall -q
          scripts/hardware/write_windows_sacrificial_drive.py
          tests/test_windows_sacrificial_writer.py

      - name: Run file-backed and negative tests
        run: python -m unittest tests/test_windows_sacrificial_writer.py -v

      - name: Enforce destructive-operation boundaries
        shell: python
        run: |
          from pathlib import Path

          source = Path(
              "scripts/hardware/write_windows_sacrificial_drive.py"
          ).read_text(encoding="utf-8")

          required = [
              "GENERIC_WRITE",
              "BWS_ENABLE_SACRIFICIAL_DRIVE_WRITE",
              "I AUTHORIZE COMPLETE DESTRUCTION OF",
              "verify_live_identity",
              "readback_sha256",
              "byte_cap",
              "--execute",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"required sacrificial-write gates missing: {missing}")

          forbidden = [
              "Clear-Disk",
              "Initialize-Disk",
              "Format-Volume",
              "Set-Partition",
              "Remove-Partition",
              "IOCTL_DISK_SET_DRIVE_LAYOUT",
              "FSCTL_DISMOUNT_VOLUME",
              "IOCTL_STORAGE_EJECT_MEDIA",
          ]
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"silent disk-management operations forbidden: {found}")

          print("SACRIFICIAL_WRITER_BOUNDARIES=pass")
