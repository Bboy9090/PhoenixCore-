name: Format Continuity Checkpoints Once

on:
  push:
    branches:
      - agent/r3-continuity-checkpoints-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-continuity-checkpoints-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install black

      - run: >-
          black
          scripts/continuity/checkpoint_store.py
          tests/test_continuity_checkpoint_store.py

      - run: |
          rm .github/workflows/format-continuity-checkpoints-once.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add scripts/continuity/checkpoint_store.py tests/test_continuity_checkpoint_store.py .github/workflows/format-continuity-checkpoints-once.yml
          git commit -m "style: format continuity checkpoint files" || exit 0
          git push
