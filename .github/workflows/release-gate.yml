name: Release Gate

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches: [ main ]

jobs:
  release-gate-checks:
    name: Verify Release Criteria and Hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate PR Release Template Checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python .github/workflows/scripts/release_gate.py --pr-ref "${{ github.event.pull_request.head.ref }}" --pr-title "${{ github.event.pull_request.title }}"

      - name: Verify Sandbox Security Signatures
        run: |
          python .github/workflows/scripts/release_gate.py --check-signatures
