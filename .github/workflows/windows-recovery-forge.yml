name: Windows Recovery Forge

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/phoenix-key/src-tauri/src/main.rs"
      - "apps/phoenix-key/src-tauri/src/windows_recovery.rs"
      - "apps/phoenix-key/src-tauri/src/recovery_center.rs"
      - "apps/phoenix-key/src-tauri/src/bin/windows_recovery_probe.rs"
      - "apps/phoenix-key/src/main.tsx"
      - "apps/phoenix-key/src/RecoveryCenter.tsx"
      - "apps/phoenix-key/src/recovery-center.css"
      - ".github/workflows/windows-recovery-forge.yml"
  push:
    branches:
      - "convergence/windows-recovery-forge-macos-v2"
    paths:
      - "apps/phoenix-key/src-tauri/src/main.rs"
      - "apps/phoenix-key/src-tauri/src/windows_recovery.rs"
      - "apps/phoenix-key/src-tauri/src/recovery_center.rs"
      - "apps/phoenix-key/src-tauri/src/bin/windows_recovery_probe.rs"
      - "apps/phoenix-key/src/main.tsx"
      - "apps/phoenix-key/src/RecoveryCenter.tsx"
      - "apps/phoenix-key/src/recovery-center.css"
      - ".github/workflows/windows-recovery-forge.yml"

jobs:
  recovery-ui:
    name: Recovery Center UI build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - run: npm ci
      - name: Type-check and build guided recovery UI
        run: npm run build

  rust-recovery-core:
    name: Rust recovery core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tauri v1 still targets WebKit2GTK 4.0. Ubuntu 22.04 is the supported
        # CI baseline and also produces a more broadly compatible Linux binary
        # than compiling on a newer glibc baseline.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/phoenix-key/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri v1 Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Formatting cleanup is intentionally separate from this functional gate so
      # legacy Phoenix Key style drift cannot hide compiler/test failures.
      - name: Recovery unit tests
        run: cargo test --bin windows_recovery_probe
      - name: Recovery probe build
        run: cargo build --bin windows_recovery_probe
      - name: Clippy recovery probe
        run: cargo clippy --bin windows_recovery_probe -- -D warnings

  destructive-boundary:
    name: Confirm recovery probe has no destructive commands
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan recovery core for forbidden writer calls
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/phoenix-key/src-tauri/src/windows_recovery.rs
            apps/phoenix-key/src-tauri/src/recovery_center.rs
            apps/phoenix-key/src-tauri/src/bin/windows_recovery_probe.rs
          )
          forbidden='execute_media_write|write_windows_sacrificial_drive|diskpart|mkfs|CreateFileW|WriteFile|DeviceIoControl|dd if=|dd of='
          if grep -En "$forbidden" "${files[@]}"; then
            echo "Recovery analysis/probe core must remain non-destructive." >&2
            exit 1
          fi
          echo "PASS: recovery analysis/probe core contains no destructive writer path."
