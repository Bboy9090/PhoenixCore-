name: Phoenix Key Signed Windows Release

on:
  push:
    branches:
      - "store-release/phoenix-key-v3.2.0"
  pull_request:
    branches: [main]
    paths:
      - "apps/phoenix-key/**"
      - ".github/workflows/windows-signed-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to attach signed installers to
        required: true
        default: phoenix-key-v3.2.0

permissions:
  contents: read

concurrency:
  group: phoenix-key-signed-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run test:artifact-receipt
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-sign-release:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.PHOENIX_KEY_WINDOWS_CODESIGN_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.PHOENIX_KEY_WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            throw "Missing PHOENIX_KEY_WINDOWS_CODESIGN_PFX_B64"
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "Missing PHOENIX_KEY_WINDOWS_CODESIGN_PFX_PASSWORD"
          }

      - run: npm ci

      - name: Build release installers
        env:
          PHOENIX_KEY_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run desktop:build

      - name: Restore code-signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.PHOENIX_KEY_WINDOWS_CODESIGN_PFX_B64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "phoenix-key-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          if ((Get-Item $pfx).Length -le 0) { throw "Decoded PFX is empty" }
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign MSI and NSIS installers
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PHOENIX_KEY_WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe not found" }

          $files = @()
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($files.Count -ne 2) { throw "Expected exactly one MSI and one NSIS installer" }

          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:PFX_PATH" /p "$env:PFX_PASSWORD" "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.Name)" }
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "Authenticode validation failed for $($file.Name): $($signature.Status)" }
          }

      - name: Emit release checksums
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          $rows = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file.FullName
            "$($hash.Hash.ToLower())  $($file.Name)"
          }
          $rows | Set-Content "src-tauri/target/release/bundle/SHA256SUMS.txt"

      - name: Upload signed Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-key-windows-signed-release
          path: |
            apps/phoenix-key/src-tauri/target/release/bundle/msi/*.msi
            apps/phoenix-key/src-tauri/target/release/bundle/nsis/*.exe
            apps/phoenix-key/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'phoenix-key-v3.2.0' }}
          name: Phoenix Key ${{ inputs.release_tag || 'phoenix-key-v3.2.0' }}
          prerelease: false
          generate_release_notes: true
          files: |
            apps/phoenix-key/src-tauri/target/release/bundle/msi/*.msi
            apps/phoenix-key/src-tauri/target/release/bundle/nsis/*.exe
            apps/phoenix-key/src-tauri/target/release/bundle/SHA256SUMS.txt
