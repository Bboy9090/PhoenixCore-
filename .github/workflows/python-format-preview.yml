name: Scoped Python Format Repair

on:
  pull_request:
    paths:
      - ".github/workflows/python-format-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-format-repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Black
        run: python -m pip install black

      - name: Apply scoped formatting repair
        run: |
          black \
            apps/android_diagnostics/android_diag.py \
            apps/computer_repair/pc_repair.py \
            apps/iphone_diagnostics/iphone_diag.py \
            ecosystem/bootforge_builder.py \
            ecosystem/compatibility_matrix.py \
            ecosystem/flash_validator.py \
            ecosystem/multiboot_engine.py \
            ecosystem/power_management.py \
            ecosystem/raw_writer.py \
            ecosystem/session_sync.py \
            ecosystem/telemetry.py \
            scripts/branding/generate_brand_v21.py \
            scripts/branding/validate_brand_v2.py
          rm .github/workflows/python-format-preview.yml

      - name: Verify scoped files are Black-clean
        run: |
          black --check \
            apps/android_diagnostics/android_diag.py \
            apps/computer_repair/pc_repair.py \
            apps/iphone_diagnostics/iphone_diag.py \
            ecosystem/bootforge_builder.py \
            ecosystem/compatibility_matrix.py \
            ecosystem/flash_validator.py \
            ecosystem/multiboot_engine.py \
            ecosystem/power_management.py \
            ecosystem/raw_writer.py \
            ecosystem/session_sync.py \
            ecosystem/telemetry.py \
            scripts/branding/generate_brand_v21.py \
            scripts/branding/validate_brand_v2.py

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/android_diagnostics/android_diag.py \
            apps/computer_repair/pc_repair.py \
            apps/iphone_diagnostics/iphone_diag.py \
            ecosystem/bootforge_builder.py \
            ecosystem/compatibility_matrix.py \
            ecosystem/flash_validator.py \
            ecosystem/multiboot_engine.py \
            ecosystem/power_management.py \
            ecosystem/raw_writer.py \
            ecosystem/session_sync.py \
            ecosystem/telemetry.py \
            scripts/branding/generate_brand_v21.py \
            scripts/branding/validate_brand_v2.py \
            .github/workflows/python-format-preview.yml
          git diff --cached --quiet && { echo "No formatting repair required."; exit 0; }
          git commit -m "style: repair post-foundation Python formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
