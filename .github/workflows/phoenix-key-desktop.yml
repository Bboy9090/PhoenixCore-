name: Phoenix Key Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "usb-creator-foundation-lock"]
    paths:
      - "apps/phoenix-key/**"
      - "usb_creator.py"
      - "device_scanner.py"
      - ".github/workflows/phoenix-key-desktop.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run build

  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phoenix-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phoenix-key/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Run Phoenix Key Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Phoenix Key installers
        run: npm run desktop:build
      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-key-windows-unsigned-preview
          path: |
            apps/phoenix-key/src-tauri/target/release/bundle/msi/*.msi
            apps/phoenix-key/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
