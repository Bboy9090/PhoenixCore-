name: One-shot format sacrificial writer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/windows-sacrificial-writer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-sacrificial-writer-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format scoped files
        run: |
          python -m pip install --upgrade pip
          pip install black
          black scripts/hardware/write_windows_sacrificial_drive.py tests/test_windows_sacrificial_writer.py

      - name: Remove workflow and commit
        run: |
          git rm .github/workflows/one-shot-format-sacrificial-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/hardware/write_windows_sacrificial_drive.py tests/test_windows_sacrificial_writer.py
          git commit -m "style: format Windows sacrificial writer"
          git push origin HEAD:agent/windows-sacrificial-writer-v1
