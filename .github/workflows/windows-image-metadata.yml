name: Windows Image Metadata

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/hardware/inspect_windows_image_metadata.py"
      - "tests/test_windows_image_metadata.py"
      - ".github/workflows/windows-image-metadata.yml"
  push:
    branches:
      - "convergence/windows-recovery-forge-macos-v2"
    paths:
      - "scripts/hardware/inspect_windows_image_metadata.py"
      - "tests/test_windows_image_metadata.py"
      - ".github/workflows/windows-image-metadata.yml"

permissions:
  contents: read

jobs:
  metadata:
    name: Image metadata (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - name: Check formatting
        run: >-
          black --check --diff
          scripts/hardware/inspect_windows_image_metadata.py
          tests/test_windows_image_metadata.py
      - name: Compile
        run: >-
          python -m compileall -q
          scripts/hardware/inspect_windows_image_metadata.py
          tests/test_windows_image_metadata.py
      - name: Run tests
        run: python -m unittest tests/test_windows_image_metadata.py -v
      - name: Confirm metadata inspector is read-only
        shell: python
        run: |
          from pathlib import Path

          source = Path(
              "scripts/hardware/inspect_windows_image_metadata.py"
          ).read_text(encoding="utf-8")
          forbidden = [
              "/Apply-Image",
              "/Mount-Image",
              "/Unmount-Image",
              "/Commit-Image",
              "/Cleanup-Image",
              "/Set-Edition",
              "/Set-ProductKey",
              "Format-Volume",
              "Set-Partition",
          ]
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(
                  f"mutating image commands forbidden in metadata inspector: {found}"
              )
          print("WINDOWS_IMAGE_METADATA_READ_ONLY=pass")
