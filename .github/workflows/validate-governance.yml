name: Validate Governance

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  governance-checks:
    name: Enforce Governance and Safety Policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Naming Boundaries (Anti-Rename checks)
        run: |
          python .github/workflows/scripts/validate_governance.py --check naming

      - name: Safety Scan for Prohibited Destructive Operations
        run: |
          python .github/workflows/scripts/validate_governance.py --check safety
