name: Windows FAT32 Media Plan

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/hardware/plan_fat32_windows_media.py"
      - "tests/test_fat32_windows_media_plan.py"
      - ".github/workflows/windows-fat32-media.yml"
  push:
    branches:
      - "convergence/windows-recovery-forge-macos-v2"
    paths:
      - "scripts/hardware/plan_fat32_windows_media.py"
      - "tests/test_fat32_windows_media_plan.py"
      - ".github/workflows/windows-fat32-media.yml"

permissions:
  contents: read

jobs:
  plan:
    name: FAT32 UEFI media planning (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - name: Check formatting
        run: >-
          black --check --diff
          scripts/hardware/plan_fat32_windows_media.py
          tests/test_fat32_windows_media_plan.py
      - name: Compile
        run: >-
          python -m compileall -q
          scripts/hardware/plan_fat32_windows_media.py
          tests/test_fat32_windows_media_plan.py
      - name: Run FAT32 media plan tests
        run: python -m unittest tests/test_fat32_windows_media_plan.py -v
      - name: Confirm planner is non-destructive
        shell: python
        run: |
          from pathlib import Path

          source = Path("scripts/hardware/plan_fat32_windows_media.py").read_text(
              encoding="utf-8"
          )
          forbidden = [
              "subprocess.run",
              "subprocess.Popen",
              "os.system",
              "diskpart",
              "format.com",
              "mkfs",
              "shutil.copy",
              "shutil.move",
              "os.replace",
          ]
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"FAT32 planner must remain non-destructive: {found}")
          print("FAT32_MEDIA_PLANNER_NON_DESTRUCTIVE=pass")
