name: One-shot format R2 ledger

on:
  push:
    branches:
      - agent/r2-evidence-ledger-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-evidence-ledger-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - run: black scripts/evidence/evidence_ledger.py tests/test_evidence_ledger.py
      - run: |
          git rm .github/workflows/one-shot-format-r2-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/evidence/evidence_ledger.py tests/test_evidence_ledger.py
          git commit -m "style(evidence): format R2 ledger files"
          git push origin HEAD:agent/r2-evidence-ledger-v1
