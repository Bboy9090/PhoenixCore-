name: One-shot registry fail-closed patch

on:
  push:
    branches:
      - agent/phoenixcore-foundation-fail-closed-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phoenixcore-foundation-fail-closed-v2
          fetch-depth: 0

      - name: Patch exact trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("usb_creator.py")
          source = path.read_text(encoding="utf-8")

          old_missing = '''        _log(
              "warning",
              "Tool registry manifest not found. Proceeding with basic validations.",
          )
          return None'''
          new_missing = '''        _log(
              "error",
              "Tool registry manifest not found. Tool validation will fail closed.",
          )
          return None'''

          old_validate = '''    if not registry:
          _log(
              "warning",
              f"Registry unavailable. Standard validation bypassed for {tool_id}.",
          )
          return True'''
          new_validate = '''    if not registry:
          _log(
              "error",
              f"Registry unavailable. Tool validation denied for {tool_id}.",
          )
          return False'''

          if source.count(old_missing) != 1:
              raise SystemExit("missing-registry block did not match exactly once")
          if source.count(old_validate) != 1:
              raise SystemExit("validation bypass block did not match exactly once")

          source = source.replace(old_missing, new_missing)
          source = source.replace(old_validate, new_validate)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-registry-fail-closed.yml

      - name: Commit scoped repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usb_creator.py
          git commit -m "fix(security): fail closed when tool registry is unavailable"
          git push origin HEAD:agent/phoenixcore-foundation-fail-closed-v2
