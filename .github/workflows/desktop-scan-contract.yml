name: Desktop scan contract qualification
on:
  pull_request:
    paths:
      - 'desktop_suite/**'
      - 'dashboard/src/App.jsx'
      - 'usb_creator.py'
      - 'device_scanner.py'
      - 'tests/test_desktop_scan_contract.py'
      - '.github/workflows/desktop-scan-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask psutil
      - run: python tests/test_desktop_scan_contract.py -v
      - run: bash -n desktop_suite/build_macos_linux.sh
