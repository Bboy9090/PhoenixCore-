name: Validate Boot Matrix

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-matrix:
    name: Verify Hardware Boot Mappings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Macbook Target Map Sanity
        run: |
          python .github/workflows/scripts/validate_boot_matrix.py
