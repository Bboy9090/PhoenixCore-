version: 0.2

env:
  shell: powershell.exe
  variables:
    PYTHONUTF8: "1"

phases:
  install:
    commands:
      - python --version
      - node --version
      - rustc --version
      - cargo --version
  pre_build:
    commands:
      - $env:ARCWYRE_SOURCE_COMMIT = git rev-parse HEAD
      - if ($env:ARCWYRE_SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Exact source SHA unavailable' }
      - git diff --exit-code
  build:
    commands:
      - python -m unittest discover -s tests -p 'test_windows*.py' -q
      - python -m unittest tests.test_arcwyre_release_gate -v
      - Push-Location dashboard; npm ci; npm run build; Pop-Location
      - Push-Location apps/phoenix-key/src-tauri; cargo test --locked; Pop-Location
  post_build:
    commands:
      - New-Item -ItemType Directory -Force -Path evidence | Out-Null
      - python scripts/release/emit_arcwyre_release_evidence.py --gate aws_windows_build --status passed --source-commit $env:ARCWYRE_SOURCE_COMMIT --executor "aws-codebuild:$env:CODEBUILD_BUILD_ID" --observed-at ((Get-Date).ToUniversalTime().ToString('o')) --evidence-uri "aws-codebuild://$env:CODEBUILD_BUILD_ARN" --output evidence/aws-windows-build.json

artifacts:
  files:
    - evidence/aws-windows-build.json
  discard-paths: false
