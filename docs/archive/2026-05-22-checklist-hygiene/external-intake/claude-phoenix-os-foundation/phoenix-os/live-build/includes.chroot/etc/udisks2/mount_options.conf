[defaults]
# Phoenix OS — udisks2 mount options
# File: /etc/udisks2/mount_options.conf
#
# Applies conservative mount defaults for internal drives when manually mounted.
# USB and removable media use system defaults (read-write, automount allowed).

# NTFS: mount with windows_names to avoid filesystem damage on case conflicts
ntfs_defaults=uid=$UID,gid=$GID,windows_names,nofail

# ext4: mount with errors=remount-ro to avoid corruption on error
ext4_defaults=errors=remount-ro

# FAT/VFAT: safe defaults
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,nofail
