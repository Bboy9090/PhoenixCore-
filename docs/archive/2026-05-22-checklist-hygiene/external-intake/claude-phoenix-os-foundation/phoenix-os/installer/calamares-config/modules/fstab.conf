# Phoenix OS — Calamares: fstab module
# File: installer/calamares-config/modules/fstab.conf
---
# Mount options written to /etc/fstab on the installed system
mountOptions:
  default: "defaults"
  btrfs:   "defaults,compress=zstd:1"

# EFI System Partition mount options
efiMountOptions: "umask=0077"

# Use partition UUIDs in fstab (recommended — stable across reboots)
luksGeneration: luks2
