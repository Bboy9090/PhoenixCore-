# Phoenix OS — Calamares: displaymanager module
# File: installer/calamares-config/modules/displaymanager.conf
#
# Configures the display manager (SDDM) on the installed system.

---
displaymanagers:
  - sddm

# Default desktop session for SDDM
defaultDesktopEnvironment:
  executable: "startplasma-wayland"
  desktopFile: "plasma"

# SDDM configuration written to /etc/sddm.conf.d/calamares.conf
sddm:
  # Do NOT configure auto-login on installed system (live session only)
  NumLock: "on"
  Theme:   "phoenix"

# Do not set auto-login for installed system
basicSetup: false
