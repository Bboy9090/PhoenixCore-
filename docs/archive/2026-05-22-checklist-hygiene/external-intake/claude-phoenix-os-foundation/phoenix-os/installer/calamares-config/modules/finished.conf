# Phoenix OS — Calamares: finished module
# File: installer/calamares-config/modules/finished.conf
#
# Configuration for the final "Installation Complete" page shown after
# all install steps have succeeded.

---
# Offer a restart button on the finished page
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "shutdown -r now"

# Do not offer to try the live session again (redundant for repair OS)
notifyOnFinished: false
