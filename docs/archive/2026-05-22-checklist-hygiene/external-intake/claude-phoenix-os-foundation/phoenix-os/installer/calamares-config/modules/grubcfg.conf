# Phoenix OS — Calamares: grubcfg module
# File: installer/calamares-config/modules/grubcfg.conf
#
# Writes /etc/default/grub on the installed system.

---
# Kernel parameters added to every GRUB entry
defaultEntry:
  kernel: "quiet splash"
  # Additional parameters for Phoenix OS:
  # - loglevel=3      : suppress most kernel messages during boot
  # - udev.log_level=3: suppress udev spam
  extraKernelParams: [ "loglevel=3", "udev.log_level=3" ]

# GRUB timeout (matches bootloader.conf)
timeout: 5

# Apply Phoenix GRUB theme
grubTheme: "/boot/grub/themes/phoenix/theme.txt"

# Hide recovery entries from the GRUB menu by default
hideMenus: true
