# Phoenix OS — Calamares: luksopenswaphookcfg module
# File: installer/calamares-config/modules/luksopenswaphookcfg.conf
#
# Configures the cryptswap hook for encrypted swap partitions.
# Only active when the user chooses encrypted install with swap.

---
# Hook name used in initramfs for opening the encrypted swap
crypttabOptions: "luks,discard"
