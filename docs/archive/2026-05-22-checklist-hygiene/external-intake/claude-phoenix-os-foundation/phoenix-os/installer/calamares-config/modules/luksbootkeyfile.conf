# Phoenix OS — Calamares: luksbootkeyfile module
# File: installer/calamares-config/modules/luksbootkeyfile.conf
#
# Generates a LUKS key file embedded in initramfs so the user only needs
# to enter their passphrase once at boot (not twice for root + swap).
# Only active when the user selects encrypted install in the partition page.

---
# Size of the generated key file in bytes (default 4096)
keyfileSize: 4096
