# Phoenix OS — Calamares: unpackfs module
# File: installer/calamares-config/modules/unpackfs.conf
#
# Defines the filesystem sources that get unpacked into the target installation.
# The squashfs from the live ISO is extracted here.

---
unpack:
  - source:     "/run/live/medium/live/filesystem.squashfs"
    sourcefs:   "squashfs"
    destination: ""

  # Uncomment if using a second squashfs layer for desktop packages:
  # - source:   "/run/live/medium/live/desktop.squashfs"
  #   sourcefs: "squashfs"
  #   destination: ""
