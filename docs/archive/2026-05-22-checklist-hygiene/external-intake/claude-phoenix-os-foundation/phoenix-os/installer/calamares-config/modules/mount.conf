# Phoenix OS — Calamares: mount module
# File: installer/calamares-config/modules/mount.conf
---
# Extra filesystems to bind-mount in the target chroot
# (for grub-install and chroot operations during install)
extraMounts:
  - device:     "proc"
    fs:         "proc"
    mountPoint: "/proc"
  - device:     "sys"
    fs:         "sysfs"
    mountPoint: "/sys"
  - device:     "efivarfs"
    fs:         "efivarfs"
    mountPoint: "/sys/firmware/efi/efivars"
    options:    "nosuid,noexec,nodev"
  - device:     "/dev"
    fs:         "devtmpfs"
    mountPoint: "/dev"
    options:    "bind"
  - device:     "/dev/pts"
    fs:         "devpts"
    mountPoint: "/dev/pts"
    options:    "bind"
  - device:     "/run"
    fs:         "tmpfs"
    mountPoint: "/run"
    options:    "bind"
