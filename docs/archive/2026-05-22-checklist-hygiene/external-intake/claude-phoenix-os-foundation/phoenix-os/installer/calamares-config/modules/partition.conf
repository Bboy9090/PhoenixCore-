# Phoenix OS — Calamares Partition Module Configuration
# File: installer/calamares-config/modules/partition.conf
#
# Controls how the disk partitioning page behaves.
# SAFETY: initialPartitioningChoice is set to "none" — the installer
# NEVER pre-selects a disk or partitioning scheme automatically.
# The user must make an explicit choice on the partition page.

---
# ============================================================
# SAFETY: No automatic disk selection
# ============================================================

# Do not pre-select any partitioning mode.
# The user must explicitly choose "Erase disk", "Manual", etc.
initialPartitioningChoice: none

# Do not pre-select any swap choice.
initialSwapChoice: none

# ============================================================
# Partitioning modes available to the user
# ============================================================

# Show the "Erase disk" option (installs to entire selected disk)
# The user must explicitly choose a disk from the dropdown.
# This is safe because disk selection is never automatic.
erase: true

# Show "Replace a partition" option
replace: true

# Show "Install alongside" option (resize and dual-boot)
alongside: true

# Show "Manual partitioning" option (advanced users)
manual: true

# ============================================================
# Swap configuration
# ============================================================

# Offer swap options to the user
# none: no swap
# small: swap partition sized to RAM
# suspend: swap sized for suspend-to-disk (2x RAM)
# file: swap file instead of partition (flexible)
availableSwapChoices:
  - none
  - small
  - suspend
  - file

# ============================================================
# EFI
# ============================================================

# Minimum size for the EFI System Partition (in MiB)
efiSystemPartitionSize: 512

# EFI mount point
efiSystemPartitionMountPoint: "/boot/efi"

# ============================================================
# Minimum disk requirements
# ============================================================

# Minimum disk size to be shown as an installation target (in GiB)
# Disks smaller than this are hidden from the disk selector.
minimumDiskSize: 20

# ============================================================
# LVM (recommended for Phoenix OS installations)
# ============================================================

# Offer LVM in the "erase disk" flow
lvm: true

# ============================================================
# Encryption
# ============================================================

# Offer full-disk encryption in the "erase disk" flow
# Requires user to set a passphrase
encryption: true

# ============================================================
# Safety warning text
# ============================================================
# TODO: Calamares does not natively support custom warning text
# in the partition module. Implement a custom QML page or
# pre-partition Python module to display Phoenix's disk safety warning.
