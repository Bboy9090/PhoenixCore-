# Phoenix OS — Calamares: packages module
# File: installer/calamares-config/modules/packages.conf
#
# Packages to install or remove on the installed system after extraction.
# This runs inside the chroot of the newly-installed system.
#
# Use this to: remove live-only packages, install installer-only packages,
# or update packages to their latest versions from the network.

---
backend: apt

# Update apt package lists before installing/removing (requires internet)
update_db: true

# Operations are skipped if no internet is available
# (warn user in the installer summary if internet is unavailable)
skip_all_services_if_no_internet: false

operations:
  # ---- Remove live-session-only packages ----
  - remove:
    - casper
    - lupin-casper
    - live-tools
    - user-setup
    - ubiquity
    - ubiquity-frontend-kde

  # ---- Install on the final system only ----
  # (These may be excluded from the ISO for size reasons)
  - install:
    - ubuntu-standard

  # ---- Ensure these are present (idempotent) ----
  - install:
    - grub-pc          # BIOS systems
    - grub-efi-amd64   # UEFI systems (installed conditionally by bootloader module)
    - os-prober        # Detect other OS for dual-boot GRUB entries
