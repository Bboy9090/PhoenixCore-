# Phoenix OS — Calamares Installer Configuration
# File: installer/calamares-config/settings.conf
#
# Main Calamares configuration file.
# Documentation: https://github.com/calamares/calamares/wiki/Config-Settings

---
# Branding component (matches directory name in branding/)
branding: phoenix

# Show a "prompt before install" dialog asking for confirmation
# before the installation sequence begins. Recommended: true.
prompt-install: true

# If true, the installer is shown in "offline" mode (no online checks)
# False: Calamares will check for network-installed packages
dont-chroot: false

# Global storage values available to all modules
global-storage:
  packageManager: apt

# The sequence of installer pages (modules) to show and run.
# Each entry is either:
#   - A string (module name, used as both show and exec module)
#   - A map with 'show' and 'exec' module lists

sequence:
  # ---- Welcome and locale ----
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary

  # ---- Installation execution ----
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg
    - initcpio
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - grubcfg
    - bootloader
    - phoenix-postinstall
    - packages
    - removeuser
    - umount

  # ---- Finish ----
  - show:
    - finished

# ============================================================
# Module search paths
# ============================================================
modules-search:
  - local
  - /usr/lib/calamares/modules
