[package]
name = "phoenix-recovery"
version = "0.1.0"
description = "Phoenix OS Recovery — guided data rescue and system repair"
authors = ["Phoenix OS Project <build@phoenix-os.io>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "phoenix-recovery"
path = "src/main.rs"

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level    = "s"
lto          = true
codegen-units = 1
panic        = "abort"
strip        = true
