# Calamares Configuration for Phoenix OS
# 
# This file configures the Calamares installer for Phoenix OS
# Calamares is a modular, distribution-agnostic installer framework

---
modules-search: [ local ]

instances:
  - id: rootfs
    module: unpackfs
    config: unpackfs.conf

  - id: vmlinuz
    module: unpackfs
    config: unpackfs-vmlinuz.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
    - installationtype
    - grubcfg
    - bootloader

  - exec:
    - partition
    - mount
    - unpackfs@rootfs
    - unpackfs@vmlinuz
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - grubcfg
    - bootloader
    - umount

  - show:
    - finished

branding: phoenix

prompt-install: true

dont-report-on-crashes: false
log-level: 5
