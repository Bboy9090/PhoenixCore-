[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-safety"
version = "1.0.0"
description = "Shared Phoenix Core safety validation (BootForge + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phoenix_safety*"]
