id: forge
display_name: "Blue Phoenix: Forge Edition"
parent: "Blue Phoenix OS"
edition_type: "technician"
tagline: "Tools. Workflows. Mastery."
description: "The industrial technician workstation tailored for heavy fieldwork and automated configurations."
inherits_core_safety_rules: true
archived: true
archive_reason: "Merged into Thunder God performance/tooling layers and ARCWYRE technician workflows."

theme:
  colors:
    primary: "#F97316"   # Ember Orange
    secondary: "#FB923C" # Light Ember Orange
    accent: "#64748B"    # Steel Blue Accent
    background: "#080604" # Industrial Slate Deep Dark
    surface: "#1C140E"
    text: "#FFEDD5"

palette:
  path: "colors.css"

branding:
  path: "branding.md"
  logo: "assets/forge-hammer.png"
  wallpaper: "assets/industrial-bay.png"
  splash: "assets/industrial-bay.png"

packages:
  profile: "package-profile.txt"
  include:
    - "bwos-core"
    - "technician-utility-suite"
  exclude: []

features:
  - "diagnostics_mode"

build:
  target: "live-image-amd64"
  compression: "zstd"
  iso_name: "bwos-forge.iso"

safety:
  allow_destructive_disk_ops_by_default: false
  require_dry_run_for_recovery_ops: true
  inherit_agent_permissions: true
  inherit_audit_rules: true
