id: blue-phoenix
display_name: "Bobby’s Worldwide OS: Blue Phoenix Edition"
parent: "Bobby’s Worldwide OS"
edition_type: "legacy"
tagline: "The classic brand legacy."
description: "Preserving the original Phoenix OS brand and visual identity. Features the classic blue-and-white theme powered by the modern BWOS Core."
inherits_core_safety_rules: true

theme:
  colors:
    primary: "#2563EB"   # Royal Blue
    secondary: "#60A5FA" # Sky Blue
    accent: "#FFFFFF"    # Pure White
    background: "#F8FAFC" # Studio White
    surface: "#FFFFFF"
    text: "#1E293B"

palette:
  path: "colors.css"

branding:
  path: "branding.md"
  logo: "assets/phoenix-classic.svg"
  wallpaper: "assets/blue-horizon.png"

packages:
  profile: "package-profile.txt"
  include:
    - "bwos-core"
    - "bootforge"
    - "legacy-utility-set"
  exclude: []

features:
  - "classic_theme_engine"
  - "legacy_app_compatibility"

build:
  target: "live-image-amd64"
  compression: "zstd"
  iso_name: "bwos-blue-phoenix.iso"

safety:
  allow_destructive_disk_ops_by_default: false
  require_dry_run_for_recovery_ops: true
  inherit_agent_permissions: true
  inherit_audit_rules: true
