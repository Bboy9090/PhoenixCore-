id: blue-phoenix
display_name: "Blue Phoenix: Aurelia Edition"
parent: "Blue Phoenix OS"
edition_type: "premium"
tagline: "Create. Inspire. Illuminate."
description: "The premier golden-accented creation suite tailored for artists, developers, and premium workstations."
inherits_core_safety_rules: true

theme:
  colors:
    primary: "#D97706"   # Aureate Gold
    secondary: "#F59E0B" # Light Gold
    accent: "#3B82F6"    # Sky Blue Accent
    background: "#080E1E" # Premium Gold Slate Dark
    surface: "#111C36"
    text: "#FEF3C7"

palette:
  path: "colors.css"

branding:
  path: "branding.md"
  logo: "assets/aurelia-logo.png"
  wallpaper: "assets/blue-horizon.png"
  splash: "assets/blue-horizon.png"

packages:
  profile: "package-profile.txt"
  include:
    - "bwos-core"
    - "bootforge"
    - "premium-creation-set"
  exclude: []

features:
  - "classic_theme_engine"
  - "premium_graphics_stack"

build:
  target: "live-image-amd64"
  compression: "zstd"
  iso_name: "bwos-aurelia.iso"

safety:
  allow_destructive_disk_ops_by_default: false
  require_dry_run_for_recovery_ops: true
  inherit_agent_permissions: true
  inherit_audit_rules: true
