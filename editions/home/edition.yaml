id: home
display_name: "Blue Phoenix: Home Edition"
parent: "Blue Phoenix OS"
edition_type: "consumer"
tagline: "Calm. Friendly. For Everyone."
description: "Approachable sky-blue consumer desktop designed for everyday workstation usage."
inherits_core_safety_rules: true

theme:
  colors:
    primary: "#0EA5E9"   # Sky Blue
    secondary: "#38BDF8" # Light Sky Blue
    accent: "#FFFFFF"    # Clean White
    background: "#0B1329" # Slate Deep Dark
    surface: "#1C2541"
    text: "#F8FAFC"

palette:
  path: "colors.css"

branding:
  path: "branding.md"
  logo: "assets/home-logo.png"
  wallpaper: "assets/home-background.png"

packages:
  profile: "package-profile.txt"
  include:
    - "bwos-core"
    - "standard-utility-set"
  exclude: []

features:
  - "citadel_desktop"

build:
  target: "live-image-amd64"
  compression: "zstd"
  iso_name: "bwos-home.iso"

safety:
  allow_destructive_disk_ops_by_default: false
  require_dry_run_for_recovery_ops: true
  inherit_agent_permissions: true
  inherit_audit_rules: true
