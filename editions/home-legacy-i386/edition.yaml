id: home-legacy-i386
display_name: "Home Aurelia OS (Legacy i386)"
parent: "Blue Phoenix OS"
edition_type: "legacy"
tagline: "Four Legacies. One Throne."
description: "Home edition compatibility track locked to the Home Aurelia visual identity for legacy 32-bit Intel hardware and EFI32 boot chains."
inherits_core_safety_rules: true

theme:
  colors:
    primary: "#2F80FF"
    secondary: "#D4A94F"
    accent: "#E5EEF9"
    background: "#05070A"
    surface: "#101827"
    text: "#F8FAFC"

palette:
  path: "colors.css"

branding:
  path: "branding.md"
  logo: "assets/home-logo.png"
  wallpaper: "assets/home-background.png"
  splash: "assets/home-background.png"

packages:
  profile: "package-profile.txt"
  include:
    - "bwos-core"
    - "standard-utility-set"
  exclude: []

features:
  - "citadel_desktop"
  - "legacy_efi32_boot"

build:
  target: "live-image-i386"
  architecture: "i386"
  linux_flavour: "686"
  bootloader: "grub-efi"
  compression: "zstd"
  artifact_format: "dd-image"
  iso_name: "bwos-home-legacy-i386.img"

safety:
  allow_destructive_disk_ops_by_default: false
  require_dry_run_for_recovery_ops: true
  inherit_agent_permissions: true
  inherit_audit_rules: true
